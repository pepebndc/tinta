name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "deploy/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://usetinta.com
    steps:
      # The key in DEPLOY_SSH_KEY has a forced command on the server: it can only
      # run /opt/tinta/deploy/deploy.sh, which pulls main and deploys it.
      - name: Deploy on the server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            root@178.105.63.159 deploy

      - name: Check the site
        run: |
          sleep 3
          curl -fsS -o /dev/null -w "%{http_code} %{url_effective}\n" https://usetinta.com/
