[workspace]
resolver = "2"
members = ["crates/tinta-core", "crates/tinta-mcp", "crates/tinta-native-host", "crates/tinta-selftest", "app/src-tauri"]

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }
uuid = { version = "1", features = ["v4"] }
