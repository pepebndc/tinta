[workspace]
resolver = "2"
members = ["crates/tinta-core", "crates/tinta-mcp", "crates/tinta-native-host", "crates/tinta-selftest", "app/src-tauri"]

[workspace.package]
version = "0.10.1"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled-sqlcipher"] }
uuid = { version = "1", features = ["v4"] }

# The Command Line Tools 27.2 remove debug information from a binary in a way that macOS 27.2 refuses to load:
# the build stops with "mis-aligned LINKEDIT string pool". Without the strip step, the binaries load.
[profile.release]
strip = "none"

[profile.release.build-override]
strip = "none"
