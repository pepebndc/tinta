# Tinta website in production: static nginx behind the shared proxy in /opt/edge.
# deploy.sh runs it. By hand: cd /opt/tinta/deploy && docker compose up -d
name: tinta

services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      # Directory mounts, so a git pull shows up without a restart.
      - ../website:/srv/website:ro
      - ./nginx:/etc/nginx/conf.d:ro
      # Stats: the access log, the GoAccess report, and the password file (server only).
      - /var/log/tinta:/var/log/nginx/tinta
      - /var/lib/tinta-stats/html:/srv/stats:ro
      - /etc/tinta:/etc/tinta:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks:
      edge:
        aliases: [tinta-web]

networks:
  edge:
    external: true
