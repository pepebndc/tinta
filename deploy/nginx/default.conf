# Serves website/ as the site root. HTTPS and compression are in the edge Caddy.
# Caddy sends the visitor's IP in X-Forwarded-For. Trust it only from the edge network.
set_real_ip_from 172.16.0.0/12;
real_ip_header   X-Forwarded-For;

server {
    listen 80;
    server_name _;
    root /srv/website;
    charset utf-8;
    server_tokens off;

    # The source of the stats page. logrotate rotates it, and GoAccess reads it.
    access_log /var/log/nginx/tinta/access.log combined;

    # Other design directions. They are not part of the site.
    location ^~ /experiments/ { return 404; }
    location = /README.md     { return 404; }

    # The GitHub links of the page go through here, so the log counts the clicks.
    # ?from= tells which link: header, hero, or footer.
    location = /github { return 302 https://github.com/pepebndc/tinta; }

    # The GoAccess report (deploy/stats/stats.sh), behind a password.
    location ^~ /stats/ {
        alias /srv/stats/;
        auth_basic "Tinta stats";
        auth_basic_user_file /etc/tinta/stats.htpasswd;
        access_log off;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }

    location / { try_files $uri $uri/ =404; }

    # The asset names have no hashes, so the cache is short.
    location ^~ /assets/ { expires 1d; add_header Cache-Control "public"; }
    location ~ \.(html|css|js)$ { add_header Cache-Control "no-cache"; }
}
