# Serves website/ as the site root. HTTPS and compression are in the edge Caddy.
server {
    listen 80;
    server_name _;
    root /srv/website;
    charset utf-8;
    server_tokens off;

    # Other design directions. They are not part of the site.
    location ^~ /experiments/ { return 404; }
    location = /README.md     { return 404; }

    location / { try_files $uri $uri/ =404; }

    # The asset names have no hashes, so the cache is short.
    location ^~ /assets/ { expires 1d; add_header Cache-Control "public"; }
    location ~ \.(html|css|js)$ { add_header Cache-Control "no-cache"; }
}
