# deploy.sh copies this file to /etc/logrotate.d/tinta.
/var/log/tinta/access.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    prerotate
        # Read the last lines into the stats before the rotation.
        systemctl start tinta-stats.service || true
    endscript
    postrotate
        docker exec tinta-web-1 nginx -s reopen >/dev/null 2>&1 || true
    endscript
}
